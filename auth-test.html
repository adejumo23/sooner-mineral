<!DOCTYPE html>
<html>
<head>
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <h1>Authentication & Data Loading Test</h1>
    <button onclick="runTest()">Run Full Test</button>
    <div id="logs"></div>
    
    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        async function runTest() {
            log('Starting authentication and data loading test...', 'info');
            
            // Test 1: Login
            try {
                log('Testing login...', 'info');
                const loginResponse = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@sooner.cap',
                        password: 'password'
                    })
                });
                
                const loginData = await loginResponse.json();
                log(`Login successful: ${JSON.stringify(loginData)}`, 'success');
            } catch (error) {
                log(`Login failed: ${error.message}`, 'error');
                return;
            }
            
            // Test 2: Fetch Tracts
            try {
                log('Testing tracts fetch...', 'info');
                const tractsResponse = await fetch('http://localhost:3001/api/tracts');
                const tractsData = await tractsResponse.json();
                log(`Tracts fetch successful: ${tractsData.length} tracts received`, 'success');
                
                if (tractsData.length > 0) {
                    log(`First tract: ${tractsData[0].tractName} (${tractsData[0].county})`, 'info');
                }
            } catch (error) {
                log(`Tracts fetch failed: ${error.message}`, 'error');
            }
            
            // Test 3: Fetch Users
            try {
                log('Testing users fetch...', 'info');
                const usersResponse = await fetch('http://localhost:3001/api/users');
                const usersData = await usersResponse.json();
                log(`Users fetch successful: ${usersData.length} users received`, 'success');
            } catch (error) {
                log(`Users fetch failed: ${error.message}`, 'error');
            }
            
            // Test 4: Fetch Units
            try {
                log('Testing units fetch...', 'info');
                const unitsResponse = await fetch('http://localhost:3001/api/units');
                const unitsData = await unitsResponse.json();
                log(`Units fetch successful: ${unitsData.length} units received`, 'success');
            } catch (error) {
                log(`Units fetch failed: ${error.message}`, 'error');
            }
            
            log('Test completed!', 'info');
        }
        
        // Auto-run test when page loads
        window.onload = runTest;
    </script>
</body>
</html>
