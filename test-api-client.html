<!DOCTYPE html>
<html>
<head>
    <title>Test API Client</title>
</head>
<body>
    <h1>Testing API Client</h1>
    <button onclick="testAPI()">Test Sections API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:3051/api/sections');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Success!</h3>
                    <p>Status: ${response.status}</p>
                    <p>Records: ${data.length}</p>
                    <p>First record: ${JSON.stringify(data[0], null, 2)}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error!</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
