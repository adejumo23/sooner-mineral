# docker compose -f docker-compose.yml pull app && docker compose -f docker-compose.yml up -d
services:
  # Combined Frontend + Backend Application
  app:
    image: docker-registry.desiumami.org/sooner-mineral-app:latest
    ports:
      - "3050:3000"  # Frontend
      - "3051:3001"  # Backend API
    environment:
      - NODE_ENV=production
      - REACT_APP_ARCGIS_API_KEY=${REACT_APP_ARCGIS_API_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - DB_HOST=mysql
      - DB_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_uploads:/app/uploads

  # MySQL Database
  mysql:
    image: docker-registry.desiumami.org/mysql:8.0
    ports:
      - "3359:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  phpmyadmin:
    image: docker-registry.desiumami.org/phpmyadmin
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 3360:80
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=America/Chicago
  # dummy:
  #   image: debian:latest # A lightweight image that can be used for simple commands
  #   command: tail -F /dev/null
  #   networks:
  #     - sooner-mineral
volumes:
  mysql_data:
  app_uploads:
